      - name: request_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [CustomerRequests]
      summary: Move a customer request through its status workflow
      description: >
        Requires CUSTOMER_REQUEST_MANAGE (never none). Strictly linear
        workflow (new -> assigned -> in_progress -> waiting_for_customer
        -> resolved -> closed), no skipping a stage. full scope (Owner/
        Manager/CustomerSupport) may make any transition the graph
        allows; assigned scope (the request's own assignee) may only
        drive the two forward-progress moves (assigned -> in_progress,
        in_progress -> waiting_for_customer) - resolving and closing
        are full-scope only. resolution_notes, if given, is applied
        regardless of whether status changes. See docs/API.md's
        Customer requests section for the full transition table.
      operationId: patchOrganizationCustomerRequestStatus
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequestStatusRequest"
      responses:
        "200":
          description: The customer request with its updated status
          content:
            application/json:
              schema:
                allOf:
