          description: Invoice retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/InvoicePublic"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Authenticated member without INVOICE_PAYMENT_MANAGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Invoice does not exist, or belongs to a different organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    patch:
      tags: [Invoices]
      summary: Edit a draft invoice
      description: >
        Requires INVOICE_PAYMENT_MANAGE. **Draft-only** - the spec's
        "Important invoice rule" ("once issued, an invoice's financial
        details are never silently overwritten"): any other status
        returns 422 INVOICE_LOCKED regardless of what's sent.
        `invoice_number` and `status` are never accepted - status
        changes go through `/issue` and `/cancel` only. `line_items`,
        if present, replaces the entire set. Totals are always
        recalculated server-side after any change.
      operationId: patchOrganizationInvoice
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceRequest"
      responses:
        "200":
          description: Invoice updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/InvoicePublic"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing/invalid CSRF token, or caller lacks INVOICE_PAYMENT_MANAGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Invoice does not exist, or belongs to a different organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: >
            Validation failed, INVOICE_LOCKED (not a draft),
            INVALID_CUSTOMER, INVALID_DISCOUNT, or NEGATIVE_TOTAL - see
            the POST endpoint's own 422 description for the last three.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /organizations/{organization_id}/invoices/{invoice_id}/pdf:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: invoice_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Invoices]
      summary: Download the invoice as a PDF
      description: >
        Requires INVOICE_PAYMENT_MANAGE - same reach as the plain JSON
        detail view; downloading the PDF isn't a different capability
        from viewing the invoice. Per FR-027: logo, business info,
        customer info, line items, taxes/discounts, totals, and
        payment status (status label + amount paid + balance due).
        Every value comes from already-server-computed columns or a
        fresh balance query (FD-043), never from request input.
      operationId: getOrganizationInvoicePdf
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The invoice, rendered as a PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Authenticated member without INVOICE_PAYMENT_MANAGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Invoice does not exist, or belongs to a different organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /organizations/{organization_id}/invoices/{invoice_id}/issue:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: invoice_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Invoices]
      summary: Issue a draft invoice (draft -> sent)
      description: >
        Requires INVOICE_PAYMENT_MANAGE. This is the action that locks
        financial details going forward. Only legal from `draft`, and
        requires at least one line item (422 EMPTY_INVOICE otherwise).
        **Not idempotent** - re-issuing an already-sent invoice is 422
        INVALID_STATUS_TRANSITION, not a no-op.
      operationId: patchOrganizationInvoiceIssue
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Invoice issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/InvoicePublic"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing/invalid CSRF token, or caller lacks INVOICE_PAYMENT_MANAGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Invoice does not exist, or belongs to a different organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Not a draft invoice (INVALID_STATUS_TRANSITION), or no line items (EMPTY_INVOICE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /organizations/{organization_id}/invoices/{invoice_id}/cancel:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: invoice_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Invoices]
      summary: Cancel an invoice (-> cancelled)
      description: >
        Requires INVOICE_PAYMENT_MANAGE. Allowed from draft/sent/
        overdue; blocked from partially_paid/paid (422
        INVALID_STATUS_TRANSITION) since money has already moved - a
        correction to a paid-against invoice is a future credit-note
        mechanism, not this endpoint. **Idempotent** on an
        already-cancelled invoice (200 no-op), unlike `/issue`.
      operationId: patchOrganizationInvoiceCancel
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Invoice cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/InvoicePublic"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing/invalid CSRF token, or caller lacks INVOICE_PAYMENT_MANAGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Invoice does not exist, or belongs to a different organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Cannot cancel once a payment has been recorded (partially_paid/paid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /organizations/{organization_id}/invoices/{invoice_id}/payments:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: invoice_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Payments]
      summary: Record a payment against an invoice
      description: >
        Requires INVOICE_PAYMENT_MANAGE. The invoice must be payable
        (sent/partially_paid/overdue); draft and cancelled are 422
        INVOICE_NOT_PAYABLE. The amount must not exceed the invoice's
        current outstanding balance (422 OVERPAYMENT otherwise - the
        user's explicit direction over allowing overpayment). On
        success the invoice transitions to paid or partially_paid in
        the same transaction as the payment insert.
        idempotency_key is required - a client-supplied idempotency
        scheme (the user's explicit direction over a server-side
        duplicate-detection heuristic), resolving Section 13's
        mandatory "duplicate payment request -> no duplicate
        transaction created" scenario. A replay with the same key and
        the same payment details returns the original payment (200,
        not 201); the same key with any different detail, or a
        different invoice_id, is 409 IDEMPOTENCY_KEY_CONFLICT.
      operationId: postOrganizationInvoicePayments
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PaymentRecordedData"
        "200":
          description: Idempotent replay - the same idempotency_key and payment details as an already-recorded payment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PaymentRecordedData"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing/invalid CSRF token, or caller lacks INVOICE_PAYMENT_MANAGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Invoice does not exist, or belongs to a different organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: idempotency_key was already used for a different payment or a different invoice (IDEMPOTENCY_KEY_CONFLICT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed, INVOICE_NOT_PAYABLE (invoice not sent/overdue/partially_paid), or OVERPAYMENT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    get:
      tags: [Payments]
      summary: List an invoice's payments, chronologically
      description: >
        Requires INVOICE_PAYMENT_MANAGE. Ordered oldest first (a
        running ledger).
      operationId: getOrganizationInvoicePayments
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      security:
        - sessionCookie: []
      responses:
        "200":
          description: A page of the invoice's payments
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentPublic"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Authenticated member without INVOICE_PAYMENT_MANAGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Invoice does not exist, or belongs to a different organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed (unknown query param or out-of-range page/per_page)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /health:
    get:
      tags: [Health]
      summary: Liveness check
      description: >
        Always returns 200 if the app process can respond. The `database`
        field reports live PostgreSQL connectivity without coupling
        liveness to it - a readiness probe, not this endpoint, should gate
        deployments on that.
      operationId: getHealth
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status, database]
                        properties:
                          status:
                            type: string
                            enum: [ok]
                          database:
                            type: string
                            enum: [ok, unavailable]
              examples:
                healthy:
                  value:
                    success: true
                    message: FlowDesk API is healthy
                    data: { status: ok, database: ok }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: >
        Server-side (Redis-backed) session, issued by POST /auth/login.
        State-changing requests also require the X-CSRF-Token header
        (see csrfToken below).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >
        Double-submit CSRF token returned by POST /auth/login. Required
        on state-changing requests made with an authenticated session
        (e.g. POST /auth/logout); not required for login/register
        themselves, since no session exists yet to protect.

  schemas:
    CreateOrganizationRequest:
      type: object
      description: Unknown fields are rejected (422), not silently dropped - e.g. role or user_id cannot be smuggled in to influence who becomes Owner.
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        logo:
          type: string
          maxLength: 2048
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 50
        address:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 code; defaults to USD if omitted.
        timezone:
          type: string
          maxLength: 64
          description: IANA zone name; defaults to UTC if omitted.
        date_format:
          type: string
          maxLength: 32

    OrganizationPublic:
      type: object
      required: [id, name, slug, currency, timezone, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        logo:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        currency:
          type: string
        timezone:
          type: string
        date_format:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    MembershipPublic:
      type: object
      description: The caller's own membership in one organization.
      required: [organization, role, status, joined_at]
      properties:
        organization:
          $ref: "#/components/schemas/OrganizationPublic"
        role:
          type: string
          enum: [owner, manager, employee, accountant, customer_support]
        status:
          type: string
          enum: [active, inactive, suspended]
        joined_at:
          type: string
          format: date-time

    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, manager, employee, accountant, customer_support]

    InvitationPublic:
      type: object
      description: Never includes the raw token or its hash - see docs/API.md's Invitations section.
      required: [id, email, role, status, expires_at, accepted_at, cancelled_at, inviter_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, manager, employee, accountant, customer_support]
        status:
          type: string
          enum: [pending, accepted, cancelled, expired]
          description: Derived, never stored directly.
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        inviter_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateDepartmentRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        manager_membership_id:
          type: string
          format: uuid
          nullable: true

    UpdateDepartmentRequest:
      type: object
      description: Partial update - every field optional. name/status may not be sent as null (422 if they are).
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        manager_membership_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [active, inactive]

    DepartmentPublic:
      type: object
      required: [id, organization_id, name, description, manager_membership_id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        manager_membership_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time

    EmployeeProfilePublic:
      type: object
      description: >
        The PATCH /employees/{membership_id} response shape - the raw
        EmployeeProfile row (FD-023), confirming what was written.
        Distinct from EmployeePublic (the GET/list shape), which
        resolves department_id/manager_membership_id into friendly
        {id, name} objects for display; this one returns the stored
        FKs as-is, same convention as DepartmentPublic's own PATCH
        response.
      required: [id, organization_id, membership_id, department_id, manager_membership_id, job_title, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        membership_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
          nullable: true
        manager_membership_id:
          type: string
          format: uuid
          nullable: true
        job_title:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, inactive, suspended]
        created_at:
          type: string
          format: date-time

    CreateTaskRequest:
      type: object
      description: >
        Deliberately does not accept assignee_membership_id (FD-027's
        job, see docs/API.md's Tasks section) or status/actual_hours
        (always to_do / unset at creation).
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, medium, high, urgent]
        department_id:
          type: string
          format: uuid
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        estimated_hours:
          type: string
          description: Decimal string, 0 to 9999.99.
          nullable: true

    AssignTaskRequest:
      type: object
      description: >
        assignee_membership_id is required (not optional-to-omit) -
        this endpoint does exactly one thing, so the caller always
        states the intended assignee; null unassigns.
      required: [assignee_membership_id]
      additionalProperties: false
      properties:
        assignee_membership_id:
          type: string
          format: uuid
          nullable: true

    UpdateTaskStatusRequest:
      type: object
      description: >
        status is required and never null - every task always has
        exactly one status (the model's own NOT NULL column).
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [to_do, in_progress, under_review, completed, cancelled]

    UpdateTaskRequest:
      type: object
      description: >
        Partial update - every field optional to include. Never
        accepts assignee_membership_id or status (use /assign or
        /status instead). title/priority may not be sent as null
        (422 if they are); the rest may, to clear them.
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, medium, high, urgent]
        department_id:
          type: string
          format: uuid
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        estimated_hours:
          type: string
          description: Decimal string, 0 to 9999.99.
          nullable: true
        actual_hours:
          type: string
          description: Decimal string, 0 to 9999.99.
          nullable: true

    CreateTaskCommentRequest:
      type: object
      description: No max length - TaskComment.body is an unbounded text column.
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1

    TaskCommentPublic:
      type: object
      required: [id, task_id, author_membership_id, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        author_membership_id:
          type: string
          format: uuid
          nullable: true
        body:
          type: string
        created_at:
          type: string
          format: date-time

    TaskHistoryPublic:
      type: object
      description: >
        event_type is a plain string, not a closed enum (FD-025's own
        docstring explains why) - currently written values include
        assignee_changed (FD-027) and <field>_changed for each editable
        field, e.g. status_changed/title_changed/priority_changed
        (FD-028/FD-029).
      required: [id, task_id, actor_membership_id, event_type, previous_value, new_value, created_at]
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        actor_membership_id:
          type: string
          format: uuid
          nullable: true
        event_type:
          type: string
        previous_value:
          type: string
          nullable: true
        new_value:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    TaskPublic:
      type: object
      required:
        [
          id,
          organization_id,
          title,
          description,
          status,
          priority,
          creator_membership_id,
          assignee_membership_id,
          department_id,
          start_date,
          due_date,
          estimated_hours,
          actual_hours,
          created_at,
          is_overdue,
        ]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [to_do, in_progress, under_review, completed, cancelled]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        creator_membership_id:
          type: string
          format: uuid
        assignee_membership_id:
          type: string
          format: uuid
          nullable: true
        department_id:
          type: string
          format: uuid
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        estimated_hours:
          type: string
          nullable: true
        actual_hours:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        is_overdue:
          type: boolean
          description: >
            FD-033 (computed, not stored): true when due_date has
            passed in the organization's own timezone and status is
            neither completed nor cancelled.

    CreateCustomerRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          maxLength: 50
          nullable: true
        company:
          type: string
          maxLength: 255
          nullable: true
        address:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    UpdateCustomerRequest:
      type: object
      description: >
        Partial update - every field optional. email/phone/company/
        address/notes accept an explicit null to clear them; name/
        status may not be sent as null (422 if they are).
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          maxLength: 50
          nullable: true
        company:
          type: string
          maxLength: 255
          nullable: true
        address:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, archived]

    CustomerPublic:
      type: object
      required: [id, organization_id, name, email, phone, company, address, notes, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        company:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, archived]
        created_at:
          type: string
          format: date-time

    CreateCustomerRequestRequest:
      type: object
      description: >
        Deliberately does not accept assignee_membership_id (its own
        /assign endpoint's job) or status (always new at creation).
      required: [customer_id, title]
      additionalProperties: false
      properties:
        customer_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        category:
          type: string
          maxLength: 255
          nullable: true
        priority:
          type: string
          enum: [low, medium, high, urgent]
        due_date:
          type: string
          format: date
          nullable: true

    AssignCustomerRequestRequest:
      type: object
      description: >
        assignee_membership_id is required (not optional-to-omit) -
        this endpoint does exactly one thing, so the caller always
        states the intended assignee; null unassigns.
      required: [assignee_membership_id]
      additionalProperties: false
      properties:
        assignee_membership_id:
          type: string
          format: uuid
          nullable: true

    UpdateCustomerRequestStatusRequest:
      type: object
      description: >
        status is required and never null - every request always has
        exactly one status. resolution_notes is optional and applied
        regardless of whether status itself changes.
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [new, assigned, in_progress, waiting_for_customer, resolved, closed]
        resolution_notes:
          type: string
          nullable: true

    CustomerRequestPublic:
      type: object
      required:
        [
          id,
          organization_id,
          customer_id,
          title,
          description,
          category,
          status,
          priority,
          creator_membership_id,
          assignee_membership_id,
          due_date,
          resolution_notes,
          created_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        status:
          type: string
          enum: [new, assigned, in_progress, waiting_for_customer, resolved, closed]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        creator_membership_id:
          type: string
          format: uuid
        assignee_membership_id:
          type: string
          format: uuid
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        resolution_notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateRequestCommentRequest:
      type: object
      description: No max length - RequestComment.body is an unbounded text column.
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1

    RequestCommentPublic:
      type: object
      required: [id, request_id, author_membership_id, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        author_membership_id:
          type: string
          format: uuid
          nullable: true
        body:
          type: string
        created_at:
          type: string
          format: date-time

    RequestHistoryPublic:
      type: object
      description: >
        event_type is a plain string, not a closed enum (RequestHistory's
        own docstring, FD-036, explains why) - currently written values
        include assignee_changed, status_changed, and
        resolution_notes_changed (FD-037).
      required: [id, request_id, actor_membership_id, event_type, previous_value, new_value, created_at]
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        actor_membership_id:
          type: string
          format: uuid
          nullable: true
        event_type:
          type: string
        previous_value:
          type: string
          nullable: true
        new_value:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    EmployeePublic:
      type: object
      description: >
        The full shape, returned only at `full` scope (Owner/Manager).
        At `limited` scope only membership_id/name/role/status are
        present in the actual response - email/job_title/department/
        manager/joined_at are omitted entirely, not sent as null (see
        docs/API.md's Employee directory section).
      required: [membership_id, name, role, status]
      properties:
        membership_id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [owner, manager, employee, accountant, customer_support]
        status:
          type: string
          enum: [active, inactive, suspended]
          nullable: true
          description: The member's EmployeeProfile status - null if they have no profile yet.
        email:
          type: string
          format: email
        job_title:
          type: string
          nullable: true
        department:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        manager:
          type: object
          nullable: true
          required: [membership_id, name]
          properties:
            membership_id:
              type: string
              format: uuid
            name:
              type: string
        joined_at:
          type: string
          format: date-time

    UpdateEmployeeProfileRequest:
      type: object
      description: >
        Partial update - every field is optional to include. Upserts the
        EmployeeProfile row if one doesn't exist yet for this membership
        (see docs/API.md's Employee profile & status management
        section). job_title/department_id/manager_membership_id accept
        an explicit null to clear them; status does not (422 if sent as
        null).
      additionalProperties: false
      properties:
        job_title:
          type: string
          maxLength: 255
          nullable: true
        department_id:
          type: string
          format: uuid
          nullable: true
        manager_membership_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [active, inactive, suspended]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Never logged or echoed back.

    UserPublic:
      type: object
      description: User, safe for API responses - never includes password_hash.
      required: [id, name, email, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, inactive, suspended]
        created_at:
          type: string
          format: date-time

    SuccessEnvelope:
      type: object
      description: Shape of every successful response.
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          description: Endpoint-specific payload.

    ErrorEnvelope:
      type: object
      description: >
        Shape of every error response - unhandled exceptions, standard
        HTTP errors (404, 405, ...), and APIError raised by route/service
        code all produce this same shape.
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: Machine-readable error code, e.g. VALIDATION_ERROR.
            message:
              type: string
            details:
              type: object
              description: Field-level or structured error detail. Empty object if none.

    PaginationMeta:
      type: object
      description: >
        Convention for every paginated list endpoint's `meta` field.
        Request params: `page` (default 1), `per_page` (default 20, max 100).
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          description: Total matching records across all pages.
        total_pages:
          type: integer
          minimum: 0

    CreatePaymentRequest:
      type: object
      description: >
        idempotency_key is required - an idempotency scheme only works
        if every caller participates (FD-043, at the user's explicit
        direction).
      required: [amount, payment_date, method, idempotency_key]
      additionalProperties: false
      properties:
        amount:
          type: string
          description: Decimal string or number; must be > 0.
        payment_date:
          type: string
          format: date
        method:
          type: string
          minLength: 1
          maxLength: 50
        reference:
          type: string
          maxLength: 255
          nullable: true
        notes:
          type: string
          nullable: true
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255

    PaymentPublic:
      type: object
      required: [id, invoice_id, amount, payment_date, method, reference, notes, idempotency_key, recorded_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        invoice_id:
          type: string
          format: uuid
        amount:
          type: string
        payment_date:
          type: string
          format: date
        method:
          type: string
        reference:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        idempotency_key:
          type: string
        recorded_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    PaymentRecordedData:
      type: object
      description: >
        The POST payments response's own `data` shape - includes the
        invoice (with its already-updated status) and the resulting
        balance alongside the payment itself, so the caller can
        observe the transactional balance update without a second
        request.
      required: [payment, invoice, amount_paid, balance_due]
      properties:
        payment:
          $ref: "#/components/schemas/PaymentPublic"
        invoice:
          $ref: "#/components/schemas/InvoicePublic"
        amount_paid:
          type: string
        balance_due:
          type: string

    FinancialSummaryPublic:
      type: object
      description: >
        total_invoiced/total_collected/outstanding_balance are
        all-time cumulative; monthly_revenue_collected is the one
        period-scoped metric, for the window named by period_start/
        period_end (see the GET .../invoices/financial-summary
        endpoint's own description).
      required:
        [
          total_invoiced,
          total_collected,
          outstanding_balance,
          overdue_invoice_count,
          period_start,
          period_end,
          monthly_revenue_collected,
          recent_payments,
        ]
      properties:
        total_invoiced:
          type: string
        total_collected:
          type: string
        outstanding_balance:
          type: string
        overdue_invoice_count:
          type: integer
          minimum: 0
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        monthly_revenue_collected:
          type: string
        recent_payments:
          type: array
          description: The latest 10 payments across the organization, newest first.
          items:
            $ref: "#/components/schemas/PaymentPublic"

    LineItemInput:
      type: object
      description: >
        One line item inside a Create/Update invoice body. line_total
        is never accepted - always server-computed (FD-041).
      required: [description, quantity, unit_price]
      additionalProperties: false
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 500
        quantity:
          type: string
          description: Decimal string or number; must be strictly positive.
        unit_price:
          type: string
          description: Decimal string or number; must be >= 0.
        tax_rate:
          type: string
          nullable: true
          description: Percentage (e.g. "8.25" means 8.25%); 0-100 if given.

    CreateInvoiceRequest:
      type: object
      description: >
        Always starts draft - status isn't accepted. invoice_number is
        server-generated (sequential per organization), never accepted
        here either.
      required: [customer_id, currency]
      additionalProperties: false
      properties:
        customer_id:
          type: string
          format: uuid
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 code, normalized to uppercase.
        issue_date:
          type: string
          format: date
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
        payment_terms:
          type: string
          maxLength: 255
          nullable: true
        discount_type:
          type: string
          enum: [flat, percentage]
          default: flat
        discount_value:
          type: string
          description: Decimal string or number; must be >= 0 (and <= 100 when discount_type is percentage).
          default: "0.00"
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/LineItemInput"
          default: []

    UpdateInvoiceRequest:
      type: object
      description: >
        Partial update, draft-only (422 INVOICE_LOCKED on any other
        status - see PATCH .../invoices/{invoice_id}). customer_id/
        currency/discount_type/discount_value/line_items may not be
        sent as null (422 if they are) - every other field accepts an
        explicit null to clear it. invoice_number and status are never
        accepted - status changes go through /issue and /cancel.
        line_items, if present, replaces the entire set.
      additionalProperties: false
      properties:
        customer_id:
          type: string
          format: uuid
        currency:
          type: string
          minLength: 3
          maxLength: 3
        issue_date:
          type: string
          format: date
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
        payment_terms:
          type: string
          maxLength: 255
          nullable: true
        discount_type:
          type: string
          enum: [flat, percentage]
        discount_value:
          type: string
          description: Decimal string or number; must be >= 0 (and <= 100 when discount_type is percentage).
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/LineItemInput"

    InvoiceLineItemPublic:
      type: object
      required: [id, invoice_id, description, quantity, unit_price, tax_rate, line_total, created_at]
      properties:
        id:
          type: string
          format: uuid
        invoice_id:
          type: string
          format: uuid
        description:
          type: string
        quantity:
          type: string
        unit_price:
          type: string
        tax_rate:
          type: string
          nullable: true
        line_total:
          type: string
          description: Server-computed (quantity * unit_price, rounded) - never client-submitted.
        created_at:
          type: string
          format: date-time

    InvoicePublic:
      type: object
      description: >
        subtotal/tax_total/discount_total/total are always
        server-computed (FD-041) - never trust a client-submitted
        value for any of these. discount_type/discount_value are the
        *input*; discount_total is the computed *output*, always a
        flat amount regardless of discount_type.
      required:
        [
          id,
          organization_id,
          customer_id,
          invoice_number,
          status,
          issue_date,
          due_date,
          currency,
          subtotal,
          tax_total,
          discount_type,
          discount_value,
          discount_total,
          total,
          notes,
          payment_terms,
          created_by,
          created_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        invoice_number:
          type: string
          description: Server-generated, sequential per organization (e.g. "INV-0001").
        status:
          type: string
          enum: [draft, sent, partially_paid, paid, overdue, cancelled]
        issue_date:
          type: string
          format: date
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        currency:
          type: string
        subtotal:
          type: string
        tax_total:
          type: string
        discount_type:
          type: string
          enum: [flat, percentage]
        discount_value:
          type: string
        discount_total:
          type: string
        total:
          type: string
        notes:
          type: string
          nullable: true
        payment_terms:
          type: string
          nullable: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
