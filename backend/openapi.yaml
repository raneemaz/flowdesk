openapi: 3.0.3
info:
  title: FlowDesk API
  description: >
    Business Operations Platform for Small Businesses. This file is the
    hand-maintained source of truth for the API contract - update it
    whenever an endpoint is added or changed (see docs/API.md).
  version: "1.0"
servers:
  - url: /api/v1
    description: Current API version (path-versioned; breaking changes get /api/v2)
tags:
  - name: Health
    description: Service liveness and dependency status
  - name: Auth
    description: Account registration and authentication
  - name: Organizations
    description: Business workspaces
  - name: Invitations
    description: Inviting new members into an organization

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Start a session
      description: >
        Verifies credentials and starts a server-side (Redis-backed)
        session. Returns a CSRF token that must be sent back as
        X-CSRF-Token on subsequent state-changing authenticated requests.
      operationId: postAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [user, csrf_token]
                        properties:
                          user:
                            $ref: "#/components/schemas/UserPublic"
                          csrf_token:
                            type: string
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid email or password (generic - never reveals which)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Credentials were correct, but the account is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                suspended:
                  value:
                    success: false
                    error:
                      code: ACCOUNT_SUSPENDED
                      message: This account is suspended.
                      details: {}
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      description: Destroys the server-side session. Requires an authenticated session and a valid CSRF token.
      operationId: postAuthLogout
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Not authenticated (no session, or the account is no longer active)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing or invalid CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current user
      description: >
        Returns the authenticated user's profile. Does not yet include
        organization memberships in the response - not part of any
        assigned task yet, even though the Membership model exists
        (FD-012). Revisit once a task explicitly calls for it.
      operationId: getAuthMe
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserPublic"
        "401":
          description: Not authenticated (no session, or the account is no longer active)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/register:
    post:
      tags: [Auth]
      summary: Create a new account
      description: >
        Creates a User only - does not create an organization or start a
        session. Organization creation (POST /organizations) is a
        separate, authenticated step requiring login first.
      operationId: postAuthRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserPublic"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                duplicate:
                  value:
                    success: false
                    error:
                      code: EMAIL_ALREADY_REGISTERED
                      message: An account with this email already exists.
                      details: { email: already registered }
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /organizations:
    post:
      tags: [Organizations]
      summary: Create an organization
      description: >
        Creates a business workspace and makes the authenticated caller
        its Owner, atomically (both rows commit together or neither
        persists). slug is auto-generated from name (collision-handled);
        currency/timezone default to USD/UTC if not given. No
        GET/PATCH /organizations/{id} for a single organization yet -
        Section 11.1 lists them but no backlog task has assigned them.
      operationId: postOrganizations
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OrganizationPublic"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing or invalid CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed (including unknown/forbidden extra fields, e.g. role or user_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    get:
      tags: [Organizations]
      summary: List my organizations
      description: >
        Lists the authenticated caller's own organization memberships -
        always scoped to the caller, never another user's (no org_id or
        user_id accepted in the request). Memberships with a non-active
        status still appear, with that status shown - deactivation never
        hides history (mirrors FR-009's rule for employee status).
      operationId: getOrganizations
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The caller's memberships
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/MembershipPublic"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /organizations/{organization_id}/invitations:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Invitations]
      summary: Create and email an invitation
      description: >
        Requires MEMBERSHIP_MANAGE (see the Authorization section of
        docs/API.md): Owner may invite any role; Manager only
        Employee/Accountant/CustomerSupport. Sends a real email via SMTP
        (backend/app/email/client.py) - the raw token is never included
        in this response, only in that email.
      operationId: postOrganizationInvitations
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/InvitationPublic"
                          - type: object
                            required: [email_delivery]
                            properties:
                              email_delivery:
                                type: string
                                enum: [sent, failed]
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing/invalid CSRF token, or the caller's role cannot invite this role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Caller is not an active member of this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Email already an active member, or already has a pending invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                alreadyPending:
                  value:
                    success: false
                    error:
                      code: INVITATION_ALREADY_PENDING
                      message: An invitation is already pending for this email.
                      details: {}
        "422":
          description: Validation failed (unknown role, extra fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    get:
      tags: [Invitations]
      summary: List every invitation for the organization
      description: Any status (pending/accepted/cancelled/expired) - history isn't hidden. Requires MEMBERSHIP_MANAGE.
      operationId: getOrganizationInvitations
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The organization's invitations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/InvitationPublic"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Authenticated member without MEMBERSHIP_MANAGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Caller is not an active member of this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /organizations/{organization_id}/invitations/{invitation_id}:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: invitation_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Invitations]
      summary: Cancel a pending invitation
      description: >
        A Manager can only cancel an invitation for a role their
        MEMBERSHIP_MANAGE scope reaches (same restriction as creating
        one) - never an Owner/Manager-role invitation.
      operationId: deleteOrganizationInvitation
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Invitation cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/InvitationPublic"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing/invalid CSRF token, or role permission does not reach this invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Invitation does not exist, or belongs to a different organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Invitation is already accepted/cancelled/expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /invitations/accept:
    post:
      tags: [Invitations]
      summary: Accept an invitation by its raw token
      description: >
        Not nested under an organization and not gated by
        require_permission - the invitee isn't a member yet. Only
        login_required + csrf_protect apply; the authenticated caller's
        own email must match the invitation's email exactly.
      operationId: postInvitationsAccept
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Invitation accepted - a new active Membership was created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MembershipPublic"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing/invalid CSRF token, or the invitation was issued to a different email (INVITATION_EMAIL_MISMATCH)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Token does not match any invitation (INVITATION_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Invitation no longer usable, or caller is already a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                expired:
                  value:
                    success: false
                    error:
                      code: INVITATION_EXPIRED
                      message: This invitation can no longer be accepted.
                      details: {}
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /health:
    get:
      tags: [Health]
      summary: Liveness check
      description: >
        Always returns 200 if the app process can respond. The `database`
        field reports live PostgreSQL connectivity without coupling
        liveness to it - a readiness probe, not this endpoint, should gate
        deployments on that.
      operationId: getHealth
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status, database]
                        properties:
                          status:
                            type: string
                            enum: [ok]
                          database:
                            type: string
                            enum: [ok, unavailable]
              examples:
                healthy:
                  value:
                    success: true
                    message: FlowDesk API is healthy
                    data: { status: ok, database: ok }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: >
        Server-side (Redis-backed) session, issued by POST /auth/login.
        State-changing requests also require the X-CSRF-Token header
        (see csrfToken below).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >
        Double-submit CSRF token returned by POST /auth/login. Required
        on state-changing requests made with an authenticated session
        (e.g. POST /auth/logout); not required for login/register
        themselves, since no session exists yet to protect.

  schemas:
    CreateOrganizationRequest:
      type: object
      description: Unknown fields are rejected (422), not silently dropped - e.g. role or user_id cannot be smuggled in to influence who becomes Owner.
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        logo:
          type: string
          maxLength: 2048
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 50
        address:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 code; defaults to USD if omitted.
        timezone:
          type: string
          maxLength: 64
          description: IANA zone name; defaults to UTC if omitted.
        date_format:
          type: string
          maxLength: 32

    OrganizationPublic:
      type: object
      required: [id, name, slug, currency, timezone, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        logo:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        currency:
          type: string
        timezone:
          type: string
        date_format:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    MembershipPublic:
      type: object
      description: The caller's own membership in one organization.
      required: [organization, role, status, joined_at]
      properties:
        organization:
          $ref: "#/components/schemas/OrganizationPublic"
        role:
          type: string
          enum: [owner, manager, employee, accountant, customer_support]
        status:
          type: string
          enum: [active, inactive, suspended]
        joined_at:
          type: string
          format: date-time

    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, manager, employee, accountant, customer_support]

    InvitationPublic:
      type: object
      description: Never includes the raw token or its hash - see docs/API.md's Invitations section.
      required: [id, email, role, status, expires_at, accepted_at, cancelled_at, inviter_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, manager, employee, accountant, customer_support]
        status:
          type: string
          enum: [pending, accepted, cancelled, expired]
          description: Derived, never stored directly.
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        inviter_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Never logged or echoed back.

    UserPublic:
      type: object
      description: User, safe for API responses - never includes password_hash.
      required: [id, name, email, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, inactive, suspended]
        created_at:
          type: string
          format: date-time

    SuccessEnvelope:
      type: object
      description: Shape of every successful response.
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          description: Endpoint-specific payload.

    ErrorEnvelope:
      type: object
      description: >
        Shape of every error response - unhandled exceptions, standard
        HTTP errors (404, 405, ...), and APIError raised by route/service
        code all produce this same shape.
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: Machine-readable error code, e.g. VALIDATION_ERROR.
            message:
              type: string
            details:
              type: object
              description: Field-level or structured error detail. Empty object if none.

    PaginationMeta:
      type: object
      description: >
        Convention for every paginated list endpoint's `meta` field.
        Request params: `page` (default 1), `per_page` (default 20, max 100).
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          description: Total matching records across all pages.
        total_pages:
          type: integer
          minimum: 0
