        required: true
        schema: { type: string, format: uuid }
      - name: task_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Tasks]
      summary: Move a task through its status workflow
      description: >
        Requires TASK_VIEW_UPDATE (never none). full scope (Owner/
        Manager) may make any transition the workflow graph allows;
        assigned scope (the task's own assignee) may only drive the
        two forward-progress moves (to_do -> in_progress, in_progress
        -> under_review) - approving, returning for revision, and
        cancelling are Owner/Manager-only. See docs/API.md's Tasks
        section for the full transition table. Records a TaskHistory
        row (event_type: status_changed) unless the request is a
        same-status no-op.
      operationId: patchOrganizationTaskStatus
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskStatusRequest"
      responses:
        "200":
          description: The task with its updated status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TaskPublic"
        "400":
          description: Request body is not valid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing/invalid CSRF token, task not assigned to an assigned-scope caller, or this specific transition is Owner/Manager-only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Caller is not an active member of this organization, or the task is missing/cross-organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed (missing/unknown field, unknown status value, or no such transition from the task's current status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

