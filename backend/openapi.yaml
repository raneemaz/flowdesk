          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Authenticated member without FINANCIAL_REPORTS_VIEW
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Caller is not an active member of this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed (period_start/period_end given alone instead of together, or an inverted range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

