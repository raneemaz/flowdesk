openapi: 3.0.3
info:
  title: FlowDesk API
  description: >
    Business Operations Platform for Small Businesses. This file is the
    hand-maintained source of truth for the API contract - update it
    whenever an endpoint is added or changed (see docs/API.md).
  version: "1.0"
servers:
  - url: /api/v1
    description: Current API version (path-versioned; breaking changes get /api/v2)
tags:
  - name: Health
    description: Service liveness and dependency status
  - name: Auth
    description: Account registration and authentication
  - name: Organizations
    description: Business workspaces
  - name: Invitations
    description: Inviting new members into an organization

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Start a session
      description: >
        Verifies credentials and starts a server-side (Redis-backed)
        session. Returns a CSRF token that must be sent back as
        X-CSRF-Token on subsequent state-changing authenticated requests.
      operationId: postAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [user, csrf_token]
                        properties:
                          user:
                            $ref: "#/components/schemas/UserPublic"
                          csrf_token:
                            type: string
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid email or password (generic - never reveals which)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Credentials were correct, but the account is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                suspended:
                  value:
                    success: false
                    error:
                      code: ACCOUNT_SUSPENDED
                      message: This account is suspended.
                      details: {}
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      description: Destroys the server-side session. Requires an authenticated session and a valid CSRF token.
      operationId: postAuthLogout
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Not authenticated (no session, or the account is no longer active)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing or invalid CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current user
      description: >
        Returns the authenticated user's profile. Does not yet include
        organization memberships in the response - not part of any
        assigned task yet, even though the Membership model exists
        (FD-012). Revisit once a task explicitly calls for it.
      operationId: getAuthMe
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserPublic"
        "401":
          description: Not authenticated (no session, or the account is no longer active)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/register:
    post:
      tags: [Auth]
      summary: Create a new account
      description: >
        Creates a User only - does not create an organization or start a
        session. Organization creation (POST /organizations) is a
        separate, authenticated step requiring login first.
      operationId: postAuthRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserPublic"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                duplicate:
                  value:
                    success: false
                    error:
                      code: EMAIL_ALREADY_REGISTERED
                      message: An account with this email already exists.
                      details: { email: already registered }
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /organizations:
    post:
      tags: [Organizations]
      summary: Create an organization
      description: >
        Creates a business workspace and makes the authenticated caller
        its Owner, atomically (both rows commit together or neither
        persists). slug is auto-generated from name (collision-handled);
        currency/timezone default to USD/UTC if not given. No
        GET/PATCH /organizations/{id} for a single organization yet -
        Section 11.1 lists them but no backlog task has assigned them.
      operationId: postOrganizations
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OrganizationPublic"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing or invalid CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed (including unknown/forbidden extra fields, e.g. role or user_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    get:
      tags: [Organizations]
      summary: List my organizations
      description: >
        Lists the authenticated caller's own organization memberships -
        always scoped to the caller, never another user's (no org_id or
        user_id accepted in the request). Memberships with a non-active
        status still appear, with that status shown - deactivation never
        hides history (mirrors FR-009's rule for employee status).
      operationId: getOrganizations
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The caller's memberships
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/MembershipPublic"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /organizations/{organization_id}/invitations:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Invitations]
      summary: Create and email an invitation
      description: >
        Requires MEMBERSHIP_MANAGE (see the Authorization section of
        docs/API.md): Owner may invite any role; Manager only
        Employee/Accountant/CustomerSupport. Sends a real email via SMTP
        (backend/app/email/client.py) - the raw token is never included
        in this response, only in that email.
      operationId: postOrganizationInvitations
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/InvitationPublic"
                          - type: object
                            required: [email_delivery]
                            properties:
                              email_delivery:
                                type: string
                                enum: [sent, failed]
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing/invalid CSRF token, or the caller's role cannot invite this role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Caller is not an active member of this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Email already an active member, or already has a pending invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                alreadyPending:
                  value:
                    success: false
                    error:
                      code: INVITATION_ALREADY_PENDING
                      message: An invitation is already pending for this email.
                      details: {}
        "422":
          description: Validation failed (unknown role, extra fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    get:
      tags: [Invitations]
      summary: List every invitation for the organization
      description: Any status (pending/accepted/cancelled/expired) - history isn't hidden. Requires MEMBERSHIP_MANAGE.
      operationId: getOrganizationInvitations
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The organization's invitations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/InvitationPublic"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Authenticated member without MEMBERSHIP_MANAGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Caller is not an active member of this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /organizations/{organization_id}/invitations/{invitation_id}:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: invitation_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Invitations]
      summary: Cancel a pending invitation
      description: >
        A Manager can only cancel an invitation for a role their
        MEMBERSHIP_MANAGE scope reaches (same restriction as creating
        one) - never an Owner/Manager-role invitation.
      operationId: deleteOrganizationInvitation
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Invitation cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/InvitationPublic"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing/invalid CSRF token, or role permission does not reach this invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Invitation does not exist, or belongs to a different organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Invitation is already accepted/cancelled/expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /invitations/accept:
    post:
      tags: [Invitations]
      summary: Accept an invitation by its raw token
      description: >
        Not nested under an organization and not gated by
        require_permission - the invitee isn't a member yet. Only
        login_required + csrf_protect apply; the authenticated caller's
        own email must match the invitation's email exactly.
      operationId: postInvitationsAccept
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Invitation accepted - a new active Membership was created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MembershipPublic"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing/invalid CSRF token, or the invitation was issued to a different email (INVITATION_EMAIL_MISMATCH)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Token does not match any invitation (INVITATION_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Invitation no longer usable, or caller is already a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                expired:
                  value:
                    success: false
                    error:
                      code: INVITATION_EXPIRED
                      message: This invitation can no longer be accepted.
                      details: {}
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /organizations/{organization_id}/departments:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Departments]
      summary: Create a department
      description: >
        Requires DEPARTMENT_MANAGE (see the Authorization section of
        docs/API.md - Owner/Manager only). manager_membership_id, if
        given, must be a real active membership in this same
        organization (checked here, not DB-enforced on the model - see
        docs/DATABASE.md's departments section).
      operationId: postOrganizationDepartments
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepartmentRequest"
      responses:
        "201":
          description: Department created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DepartmentPublic"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing/invalid CSRF token, or caller lacks DEPARTMENT_MANAGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Caller is not an active member of this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed, or manager_membership_id is not a real active membership in this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidManager:
                  value:
                    success: false
                    error:
                      code: INVALID_MANAGER_MEMBERSHIP
                      message: manager_membership_id must reference an active membership in this organization.
                      details: { manager_membership_id: must reference an active membership in this organization }

    get:
      tags: [Departments]
      summary: List every department for the organization
      description: Any status (active/inactive) - deactivation never hides history. Requires DEPARTMENT_MANAGE.
      operationId: getOrganizationDepartments
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The organization's departments, sorted by name
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/DepartmentPublic"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Authenticated member without DEPARTMENT_MANAGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Caller is not an active member of this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /organizations/{organization_id}/departments/{department_id}:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: department_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Departments]
      summary: Update a department
      description: >
        Partial update - only fields present in the request body
        change. description/manager_membership_id accept an explicit
        null to clear them; name/status don't (422 if sent as null).
        status may be set back to "active" here (reactivation) - there
        is no separate reactivate endpoint.
      operationId: patchOrganizationDepartment
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDepartmentRequest"
      responses:
        "200":
          description: Department updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DepartmentPublic"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing/invalid CSRF token, or caller lacks DEPARTMENT_MANAGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Department does not exist, or belongs to a different organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed, or manager_membership_id is not a real active membership in this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    delete:
      tags: [Departments]
      summary: Deactivate a department (soft)
      description: >
        Sets status to inactive - never deletes the row. Idempotent: a
        department already inactive is a 200 no-op, not an error. Every
        historical EmployeeProfile.department_id reference to it
        survives untouched.
      operationId: deleteOrganizationDepartment
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Department deactivated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DepartmentPublic"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing/invalid CSRF token, or caller lacks DEPARTMENT_MANAGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Department does not exist, or belongs to a different organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /organizations/{organization_id}/employees:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: search
        in: query
        description: Matches the member's name only - never email, for any scope (see docs/API.md's Employee directory section).
        schema: { type: string, maxLength: 255 }
      - name: department_id
        in: query
        schema: { type: string, format: uuid }
      - name: role
        in: query
        schema:
          type: string
          enum: [owner, manager, employee, accountant, customer_support]
      - name: status
        in: query
        description: The member's EmployeeProfile status, not Membership.status - see docs/DATABASE.md.
        schema:
          type: string
          enum: [active, inactive, suspended]
      - name: page
        in: query
        schema: { type: integer, minimum: 1, default: 1 }
      - name: per_page
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    get:
      tags: [Employees]
      summary: Search, filter, and paginate the organization's employee directory
      description: >
        Requires EMPLOYEE_DIRECTORY_VIEW (see the Authorization section
        of docs/API.md) - never none, so every active member sees some
        version of this list. The response's field set depends on the
        caller's scope: full (Owner/Manager) gets every EmployeePublic
        field; limited (Employee/Accountant/CustomerSupport) gets only
        membership_id/name/role/status - email/job_title/department/
        manager/joined_at are omitted from the response entirely, not
        just nulled. Lists every ACTIVE membership in the org, whether
        or not it has an EmployeeProfile yet.
      operationId: getOrganizationEmployees
      security:
        - sessionCookie: []
      responses:
        "200":
          description: A page of the organization's employee directory
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmployeePublic"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Caller is not an active member of this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed (unknown query param, out-of-range page/per_page, malformed department_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /organizations/{organization_id}/employees/{membership_id}:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: membership_id
        in: path
        required: true
        description: The target employee's Membership id (not the caller's own).
        schema: { type: string, format: uuid }
    get:
      tags: [Employees]
      summary: View one employee's profile
      description: >
        Requires EMPLOYEE_DIRECTORY_VIEW, same as the list endpoint
        (never none). Returns the full EmployeePublic shape if the
        caller has full scope or is viewing their own profile,
        otherwise the limited shape (see docs/API.md's Employee profile
        & status management section).
      operationId: getOrganizationEmployee
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The employee's profile (full or limited shape, see above)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EmployeePublic"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Caller is not an active member of this organization, or the target membership is missing/cross-organization/inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [Employees]
      summary: Update (and implicitly create) an employee's profile/status
      description: >
        Requires EMPLOYEE_MANAGE (full for Owner, limited for Manager -
        restricted to Employee/Accountant/CustomerSupport targets by an
        object-level check, none for everyone else). Upserts the
        EmployeeProfile row.
      operationId: patchOrganizationEmployee
      security:
        - sessionCookie: []
      requestBody:
        required: true
