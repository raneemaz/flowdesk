openapi: 3.0.3
info:
  title: FlowDesk API
  description: >
    Business Operations Platform for Small Businesses. This file is the
    hand-maintained source of truth for the API contract - update it
    whenever an endpoint is added or changed (see docs/API.md).
  version: "1.0"
servers:
  - url: /api/v1
    description: Current API version (path-versioned; breaking changes get /api/v2)
tags:
  - name: Health
    description: Service liveness and dependency status

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      description: >
        Always returns 200 if the app process can respond. The `database`
        field reports live PostgreSQL connectivity without coupling
        liveness to it - a readiness probe, not this endpoint, should gate
        deployments on that.
      operationId: getHealth
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status, database]
                        properties:
                          status:
                            type: string
                            enum: [ok]
                          database:
                            type: string
                            enum: [ok, unavailable]
              examples:
                healthy:
                  value:
                    success: true
                    message: FlowDesk API is healthy
                    data: { status: ok, database: ok }

components:
  schemas:
    SuccessEnvelope:
      type: object
      description: Shape of every successful response.
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          description: Endpoint-specific payload.

    ErrorEnvelope:
      type: object
      description: >
        Shape of every error response - unhandled exceptions, standard
        HTTP errors (404, 405, ...), and APIError raised by route/service
        code all produce this same shape.
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: Machine-readable error code, e.g. VALIDATION_ERROR.
            message:
              type: string
            details:
              type: object
              description: Field-level or structured error detail. Empty object if none.

    PaginationMeta:
      type: object
      description: >
        Convention for every paginated list endpoint's `meta` field.
        Request params: `page` (default 1), `per_page` (default 20, max 100).
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          description: Total matching records across all pages.
        total_pages:
          type: integer
          minimum: 0
