                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CustomerRequestPublic"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing/invalid CSRF token, caller's scope is none, or an assigned-scope caller attempted a transition reserved to full scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Caller is not an active member of this organization, or the request is missing/cross-organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed (unknown status value, no such transition from the current status, or assigned targeted without assignee_membership_id already set)
          content:
            application/json:
