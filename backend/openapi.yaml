      responses:
        "200":
          description: The updated task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TaskPublic"
        "400":
          description: Request body is not valid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Missing/invalid CSRF token, or caller's TASK_CREATE_ASSIGN scope is none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Caller is not an active member of this organization, or the task is missing/cross-organization
          content:
