              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /health:
    get:
      tags: [Health]
      summary: Liveness check
      description: >
        Always returns 200 if the app process can respond. The `database`
        field reports live PostgreSQL connectivity without coupling
        liveness to it - a readiness probe, not this endpoint, should gate
        deployments on that.
      operationId: getHealth
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status, database]
                        properties:
                          status:
                            type: string
                            enum: [ok]
                          database:
                            type: string
                            enum: [ok, unavailable]
              examples:
                healthy:
                  value:
                    success: true
                    message: FlowDesk API is healthy
                    data: { status: ok, database: ok }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: >
        Server-side (Redis-backed) session, issued by POST /auth/login.
        State-changing requests also require the X-CSRF-Token header
        (see csrfToken below).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >
        Double-submit CSRF token returned by POST /auth/login. Required
        on state-changing requests made with an authenticated session
        (e.g. POST /auth/logout); not required for login/register
        themselves, since no session exists yet to protect.

  schemas:
    CreateOrganizationRequest:
      type: object
      description: Unknown fields are rejected (422), not silently dropped - e.g. role or user_id cannot be smuggled in to influence who becomes Owner.
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        logo:
          type: string
          maxLength: 2048
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 50
        address:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 code; defaults to USD if omitted.
        timezone:
          type: string
          maxLength: 64
          description: IANA zone name; defaults to UTC if omitted.
        date_format:
          type: string
          maxLength: 32

    OrganizationPublic:
      type: object
      required: [id, name, slug, currency, timezone, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        logo:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        currency:
          type: string
        timezone:
          type: string
        date_format:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    MembershipPublic:
      type: object
      description: The caller's own membership in one organization.
      required: [organization, role, status, joined_at]
      properties:
        organization:
          $ref: "#/components/schemas/OrganizationPublic"
        role:
          type: string
          enum: [owner, manager, employee, accountant, customer_support]
        status:
          type: string
          enum: [active, inactive, suspended]
        joined_at:
          type: string
          format: date-time

    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, manager, employee, accountant, customer_support]

    InvitationPublic:
      type: object
      description: Never includes the raw token or its hash - see docs/API.md's Invitations section.
      required: [id, email, role, status, expires_at, accepted_at, cancelled_at, inviter_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, manager, employee, accountant, customer_support]
        status:
          type: string
          enum: [pending, accepted, cancelled, expired]
          description: Derived, never stored directly.
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        inviter_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateDepartmentRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        manager_membership_id:
          type: string
          format: uuid
          nullable: true

    UpdateDepartmentRequest:
      type: object
      description: Partial update - every field optional. name/status may not be sent as null (422 if they are).
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        manager_membership_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [active, inactive]

    DepartmentPublic:
      type: object
      required: [id, organization_id, name, description, manager_membership_id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        manager_membership_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time

    EmployeeProfilePublic:
      type: object
      description: >
        The PATCH /employees/{membership_id} response shape - the raw
        EmployeeProfile row (FD-023), confirming what was written.
        Distinct from EmployeePublic (the GET/list shape), which
        resolves department_id/manager_membership_id into friendly
        {id, name} objects for display; this one returns the stored
        FKs as-is, same convention as DepartmentPublic's own PATCH
        response.
      required: [id, organization_id, membership_id, department_id, manager_membership_id, job_title, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        membership_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
          nullable: true
        manager_membership_id:
          type: string
          format: uuid
          nullable: true
        job_title:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, inactive, suspended]
        created_at:
          type: string
          format: date-time

    CreateTaskRequest:
      type: object
      description: >
        Deliberately does not accept assignee_membership_id (FD-027's
        job, see docs/API.md's Tasks section) or status/actual_hours
        (always to_do / unset at creation).
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, medium, high, urgent]
        department_id:
          type: string
          format: uuid
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        estimated_hours:
          type: string
          description: Decimal string, 0 to 9999.99.
          nullable: true

    AssignTaskRequest:
      type: object
      description: >
        assignee_membership_id is required (not optional-to-omit) -
        this endpoint does exactly one thing, so the caller always
        states the intended assignee; null unassigns.
      required: [assignee_membership_id]
      additionalProperties: false
      properties:
        assignee_membership_id:
          type: string
          format: uuid
          nullable: true

    UpdateTaskStatusRequest:
      type: object
      description: >
        status is required and never null - every task always has
        exactly one status (the model's own NOT NULL column).
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [to_do, in_progress, under_review, completed, cancelled]

    UpdateTaskRequest:
      type: object
      description: >
        Partial update - every field optional to include. Never
        accepts assignee_membership_id or status (use /assign or
        /status instead). title/priority may not be sent as null
        (422 if they are); the rest may, to clear them.
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, medium, high, urgent]
        department_id:
          type: string
          format: uuid
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        estimated_hours:
          type: string
          description: Decimal string, 0 to 9999.99.
          nullable: true
        actual_hours:
          type: string
          description: Decimal string, 0 to 9999.99.
          nullable: true

    CreateTaskCommentRequest:
      type: object
      description: No max length - TaskComment.body is an unbounded text column.
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1

    TaskCommentPublic:
      type: object
      required: [id, task_id, author_membership_id, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        author_membership_id:
          type: string
          format: uuid
          nullable: true
        body:
          type: string
        created_at:
          type: string
          format: date-time

    TaskPublic:
      type: object
      required:
        [
          id,
          organization_id,
          title,
          description,
          status,
          priority,
          creator_membership_id,
          assignee_membership_id,
          department_id,
          start_date,
          due_date,
          estimated_hours,
          actual_hours,
          created_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [to_do, in_progress, under_review, completed, cancelled]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        creator_membership_id:
          type: string
          format: uuid
        assignee_membership_id:
          type: string
          format: uuid
          nullable: true
        department_id:
          type: string
          format: uuid
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        estimated_hours:
          type: string
          nullable: true
        actual_hours:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    EmployeePublic:
      type: object
      description: >
        The full shape, returned only at `full` scope (Owner/Manager).
        At `limited` scope only membership_id/name/role/status are
        present in the actual response - email/job_title/department/
        manager/joined_at are omitted entirely, not sent as null (see
        docs/API.md's Employee directory section).
      required: [membership_id, name, role, status]
      properties:
        membership_id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [owner, manager, employee, accountant, customer_support]
        status:
          type: string
          enum: [active, inactive, suspended]
          nullable: true
          description: The member's EmployeeProfile status - null if they have no profile yet.
        email:
          type: string
          format: email
        job_title:
          type: string
          nullable: true
        department:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        manager:
          type: object
          nullable: true
          required: [membership_id, name]
          properties:
            membership_id:
              type: string
              format: uuid
            name:
              type: string
        joined_at:
          type: string
          format: date-time

    UpdateEmployeeProfileRequest:
      type: object
      description: >
        Partial update - every field is optional to include. Upserts the
        EmployeeProfile row if one doesn't exist yet for this membership
        (see docs/API.md's Employee profile & status management
        section). job_title/department_id/manager_membership_id accept
        an explicit null to clear them; status does not (422 if sent as
        null).
      additionalProperties: false
      properties:
        job_title:
          type: string
          maxLength: 255
          nullable: true
        department_id:
          type: string
          format: uuid
          nullable: true
        manager_membership_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [active, inactive, suspended]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Never logged or echoed back.

    UserPublic:
      type: object
      description: User, safe for API responses - never includes password_hash.
      required: [id, name, email, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, inactive, suspended]
        created_at:
          type: string
          format: date-time

    SuccessEnvelope:
      type: object
      description: Shape of every successful response.
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          description: Endpoint-specific payload.

    ErrorEnvelope:
      type: object
      description: >
        Shape of every error response - unhandled exceptions, standard
        HTTP errors (404, 405, ...), and APIError raised by route/service
        code all produce this same shape.
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: Machine-readable error code, e.g. VALIDATION_ERROR.
            message:
              type: string
            details:
              type: object
              description: Field-level or structured error detail. Empty object if none.

    PaginationMeta:
      type: object
      description: >
        Convention for every paginated list endpoint's `meta` field.
        Request params: `page` (default 1), `per_page` (default 20, max 100).
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          description: Total matching records across all pages.
        total_pages:
          type: integer
          minimum: 0
